app = "miraflores-workpaper"
primary_region = "sjc"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

# The event log (SQLite) and attached files live on the volume; the packet ships in the image.
[mounts]
  source = "workpaper_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
